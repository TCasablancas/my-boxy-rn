buildscript {
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.20"
    agp_version = '8.5.2'
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:$agp_version")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }


  subprojects { subproject ->
    afterEvaluate {
      if (subproject.hasProperty('android')) {
        if (subproject.android.namespace == null && subproject.android.sourceSets.main.manifest.srcFile.exists()) {
          def manifestFile = subproject.android.sourceSets.main.manifest.srcFile
          def manifest = new XmlParser().parse(manifestFile)
          if (manifest.@package) {
              subproject.android.namespace = manifest.@package
          }
        }
      }
    }
  }
}

apply plugin: "com.facebook.react.rootproject"
